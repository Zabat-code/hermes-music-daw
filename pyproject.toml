[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-music-daw"
version = "0.1.0"
description = "Audited MIDI composition and a headless MCP mixing server"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "the hermes-music-daw authors"}]
dependencies = [
    "mido==1.3.3",
    "numpy==2.5.3",
    "pedalboard==0.9.26",
    "fastmcp==4.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
hermes-music = "hermes_music.scripts.hermesmusic:main"
hermes-daw = "hermes_music.scripts.daw_mcp:main"
hermes-music-guard = "hermes_music.scripts.composition_guard:main"
hermes-music-audit = "hermes_music.scripts.audit_arrangement:main"
hermes-music-check = "hermes_music.scripts.check_install:main"
hermes-mix = "hermes_music.scripts.mix_engine:main"

[tool.setuptools]
packages = ["hermes_music", "hermes_music.scripts"]
package-dir = {hermes_music = "."}
include-package-data = false

[tool.setuptools.package-data]
hermes_music = ["references/*.json", "references/*.md", "docs/*.md", "SKILL.md", "PROTOCOL.md", "ENSAMBLE.md", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: requires installed FluidSynth, FFmpeg and SoundFont"]
